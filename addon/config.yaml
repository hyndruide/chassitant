name: "Françoise — Chatbot IA Autonome (Multi-Fournisseurs)"
slug: "chassitant_agy"
description: "Chatbot IA autonome Home Assistant (Google Antigravity agy, OpenAI Codex, Groq, OpenRouter, Ollama) avec Drawer, raccourcis HA_CONTEXT.md et serveur MCP embarqué."
version: "1.8.19"
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8098
panel_icon: mdi:robot-excited
panel_title: "Françoise"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Port HTTP Bridge pour la communication avec Assist"
map:
  - config:rw
  - share:rw
options:
  port: 8099
  provider: "agy"
  groq_api_key: ""
  openrouter_api_key: ""
  ollama_url: "http://localhost:11434/v1"
  model: "default"
  effort: "low"
  pre_prompt: ""
  dangerously_skip_permissions: true
schema:
  port: "int"
  provider: "list(agy|codex|groq|openrouter|ollama)?"
  groq_api_key: "password?"
  openrouter_api_key: "password?"
  ollama_url: "str?"
  model: "str?"
  effort: "list(low|medium|high|xhigh|max)?"
  pre_prompt: "str?"
  dangerously_skip_permissions: "bool?"
