name: "Chassitant (Antigravity agy)"
slug: "chassitant_agy"
description: "Chatbot IA avec Drawer rétractable, Guide contextuel & raccourcis HA_CONTEXT.md, Google Antigravity agy et serveur MCP Home Assistant pré-embarqué."
version: "1.5.0"
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8098
panel_icon: mdi:robot-excited
panel_title: "Chassitant"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Port HTTP Bridge pour la communication avec Assist"
map:
  - config:rw
  - share:rw
options:
  port: 8099
  model: "default"
  effort: "low"
  dangerously_skip_permissions: true
schema:
  port: "int"
  model: "str?"
  effort: "list(low|medium|high|xhigh|max)?"
  dangerously_skip_permissions: "bool?"
